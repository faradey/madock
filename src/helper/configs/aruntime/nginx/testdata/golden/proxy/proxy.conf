server {
    listen       80  default_server;
    listen 443 default_server ssl;
    http2 on;
    server_name  _;
    return       444;
    ssl_certificate /sslcert/fullchain.crt;
    ssl_certificate_key /sslcert/madock.local.key;
    include /sslcert/options-ssl-nginx.conf; 
}

}