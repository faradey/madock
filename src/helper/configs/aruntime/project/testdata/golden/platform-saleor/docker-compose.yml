name: madock_golden
services:
  nginx:
    init: true
    build:
      context: ctx
      dockerfile: nginx.Dockerfile
    ports:
      - "<PORT>:80"
      - "<PORT>:443"
    volumes:
      - ./src:/var/www/html:delegated
      - ./ctx/nginx.conf:/etc/nginx/conf.d/default.conf:delegated
      # Logs a rebuild cannot take away. Docker keeps a container's stdout in
      # the container's own directory, so `rebuild` deletes it — measured on a
      # production machine mid-incident, where three deploys left no HTTP record
      # of the minute being investigated.
      - logsdata:/var/log/madock
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "golden.test:host-gateway"
    depends_on:
      - python
    restart: no
  python:
    init: true
    build:
      context: ctx
      dockerfile: python.Dockerfile
    tty: true
    volumes:
      - ./src:/var/www/html:cached
      - ./ssh:/var/www/.ssh:ro
      - ./ssh/known_hosts:/var/www/.ssh/known_hosts:cached
    environment:
      - PYTHONDONTWRITEBYTECODE=1
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "golden.test:host-gateway"
    restart: no
  db:
    init: true
    build:
      context: ctx
      dockerfile: db.Dockerfile
    # Sized from db/memory, because postgres otherwise takes its stock
    # shared_buffers of 128MB and the only way to raise it was a copy of the
    # config in the project. effective_cache_size buys no memory — it tells the
    # planner how much of the OS cache to expect.
    command: >
      postgres
      -c shared_buffers=192MB
      -c effective_cache_size=576MB
    ports:
      - "<PORT>:5432"
    environment:
      POSTGRES_DB: "magento"
      POSTGRES_USER: "magento"
      POSTGRES_PASSWORD: "magento"
    volumes:
      - dbdata:/var/lib/postgresql/data
    restart: no
  redisdb:
    init: true
    build:
      context: ctx
      dockerfile: redis.Dockerfile
    restart: no

volumes:
  # Declared unconditionally on purpose. Every other entry here is optional, so
  # gating this one too lets `volumes:` render empty when a project runs without
  # a database, without search and without grafana — and compose rejects that
  # with "volumes must be a mapping". An unused named volume costs nothing.
  dbdata:
  # The logs the services write as files. A named volume rather than a bind
  # mount, and that is the second answer to the same question: a bind mount put
  # root-owned files under aruntime/projects/<name>/, and `project:remove` —
  # which runs as the person, not as root — then could not delete the project
  # directory at all. CI found it as a database that would not start, because
  # the leftover volume from the undeleted project carried the old root
  # password. A named volume survives `rebuild` exactly as dbdata does, and
  # `project:remove` takes it down with everything else.
  logsdata:

networks:
  madock-proxy:
    external: true

