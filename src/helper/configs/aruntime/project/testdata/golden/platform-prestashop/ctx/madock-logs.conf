# Persisted logs for this project's web server.
#
# These directives live in a file of their own, mounted into conf.d, and that is
# the whole point of the file: everything in conf.d is included **inside the
# http block**, so this applies to every server block the project has —
# including a vhost the project ships itself in `.madock/docker/`, which
# replaces madock's template wholesale and took the directives with it when they
# lived there. Measured on extmag.com 2026-09-10: the volume was mounted, the
# database wrote its slow log, and nginx wrote nothing at all, because that
# project carries its own `nginx/conf/default.conf`.
#
# A server block that sets its own `access_log` still wins for that server,
# which is correct: a project that has decided where its log goes has decided.
access_log /var/log/madock/nginx-access.log;
access_log /dev/stdout;
error_log  /var/log/madock/nginx-error.log warn;
