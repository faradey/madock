name: madock_golden
services:
  php:
    init: true
    build:
      context: ctx
      dockerfile: php.Dockerfile
    volumes:
      - ./src:/var/www/html:cached
      - ./composer:/var/www/.composer:cached
      - ./ssh:/var/www/.ssh:ro
      - ./ssh/known_hosts:/var/www/.ssh/known_hosts:cached
      - ./ctx/scripts/:/var/www/scripts/:cached
    environment:
      - COMPOSER_HOME=/var/www/.composer
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "golden.test:host-gateway"
    ports:
      - "<PORT>:35729"
      - "<PORT>:5173"
      - "<PORT>:9998"
      - "<PORT>:9999"
    restart: no
  nginx:
    init: true
    build:
      context: ctx
      dockerfile: nginx.Dockerfile
    ports:
      - "<PORT>:80"
      - "<PORT>:443"
    volumes:
      - ./src:/var/www/html:delegated
      - ./ctx/nginx.conf:/etc/nginx/conf.d/default.conf:delegated
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "golden.test:host-gateway"
    depends_on:
      - php
    restart: no
  db:
    init: true
    build:
      context: ctx
      dockerfile: db.Dockerfile
    # The one engine that must be told. Left alone, WiredTiger sizes its cache
    # from the RAM it can see — the host's, not the container's limit — so on a
    # large machine one mongod quietly reserves gigabytes.
    command: mongod --wiredTigerCacheSizeGB 0.375
    ports:
      - "<PORT>:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: "magento"
      MONGO_INITDB_ROOT_PASSWORD: "magento"
      MONGO_INITDB_DATABASE: "magento"
    volumes:
      - dbdata:/data/db
    restart: no
  opensearch:
    init: true
    build:
      context: ctx
      dockerfile: opensearch.Dockerfile
    deploy:
      resources:
        limits:
          memory: 2512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      OPENSEARCH_DISCOVERY_TYPE: 'single-node'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      DISABLE_SECURITY_PLUGIN: 'true'
      ES_JAVA_OPTS: '-Xms800m -Xmx800m'
    volumes:
      - opensearch_vlm_2.19.0:/usr/share/opensearch/data
    restart: no

volumes:
  # Declared unconditionally on purpose. Every other entry here is optional, so
  # gating this one too lets `volumes:` render empty when a project runs without
  # a database, without search and without grafana — and compose rejects that
  # with "volumes must be a mapping". An unused named volume costs nothing.
  dbdata:
  opensearch_vlm_2.19.0:

networks:
  madock-proxy:
    external: true
