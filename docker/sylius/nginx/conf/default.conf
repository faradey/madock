{{{template "snippets/nginx/forwarded.conf" .}}}
fastcgi_buffer_size 64k;
fastcgi_buffers 1024 64k;

upstream fastcgi_backend_xdebug_false {
    server  php:9000;
}
{{{- if and .php.enabled .php.xdebug.enabled}}}
upstream fastcgi_backend_xdebug_true {
    server  php_without_xdebug:9000;
}
{{{- end}}}

server {

{{{- if .logs.persist.enabled}}}
    # To a file as well as to stdout, and both on purpose: `madock logs` reads
    # the container's stream, which docker deletes with the container, while the
    # file lives in the installation and survives a rebuild. nginx accepts any
    # number of access_log directives, so neither costs the other.
    access_log /var/log/madock/nginx-access.log;
    access_log /dev/stdout;
    error_log  /var/log/madock/nginx-error.log warn;
    error_log  /dev/stderr warn;
{{{- end}}}
    listen      {{{.nginx.port.internal}}};
    server_name {{{range $i, $host := .nginx.hosts}}}{{{if $i}}} {{{end}}}{{{$host.name}}}{{{end}}};

    index index.php;
    client_max_body_size       {{{.nginx.max_body_size}}};

    root {{{.workdir}}}/{{{.public_dir}}};

    # The ^~ prefixes below (/build/, /media/, /bundles/) win over any regex,
    # so this covers everything except those three paths.
    # Dotfiles and dot-directories at any path segment: .git, .env, .htaccess,
    # .user.ini, .DS_Store. /.well-known/ is exempt so an ACME challenge stays
    # reachable. First among the regex locations because nginx takes the first
    # regex that matches, and the static-file blocks below would otherwise answer
    # anything ending in a served extension.
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location = /sitemap.xml {
        log_not_found off;
        access_log off;
        try_files $uri /;
    }

    location = /robots.txt {
        log_not_found off;
        access_log off;
        try_files $uri /;
    }

    # Long-cache hashed assets emitted by Webpack Encore (`build/`).
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ^~ /media/ {
        try_files $uri =404;
    }

    location ^~ /bundles/ {
        try_files $uri =404;
    }

    location ~* ^.+\.(?:css|cur|js|jpe?g|gif|ico|png|svg|webp|htm|woff|woff2|xml)$ {
       expires 1y;
       add_header Cache-Control "public, must-revalidate, proxy-revalidate";

       access_log off;
       log_not_found off;

       tcp_nodelay off;
       open_file_cache max=3000 inactive=120s;
       open_file_cache_valid 45s;
       open_file_cache_min_uses 2;
       open_file_cache_errors off;
    }

    location ~* ^.+\.svg$ {
       add_header Content-Security-Policy "script-src 'none'";
   }

    # Symfony front controller — forward everything to index.php
    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Block direct access to .php files other than index.php (Symfony best practice)
    location ~ ^/index\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass fastcgi_backend_xdebug_{{{.php.xdebug.enabled}}};
        fastcgi_param  PHP_FLAG  "session.auto_start=off";
        fastcgi_param  PHP_VALUE "memory_limit={{{.php.limits.memory}}} \n max_execution_time={{{.php.limits.max_execution_time}}}";
        fastcgi_read_timeout 18000s;
        fastcgi_connect_timeout 18000s;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        fastcgi_param HTTPS $fastcgi_https;
        include fastcgi_params;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
