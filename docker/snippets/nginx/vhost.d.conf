    # The project's own additions to this server block.
    #
    # Every *.conf under .madock/docker/nginx/vhost.d/ (or the local
    # projects/<name>/docker/nginx/vhost.d/) is rendered into ctx/nginx-vhost.d
    # and mounted here. Before this a project that needed one location of its
    # own had to copy the whole vhost into .madock/docker/, and the copy stopped
    # receiving the template's fixes from that day on.
    #
    # Included first, on purpose: among regex locations nginx takes the first
    # match in file order, so a project's rule wins over the template's. A
    # directive the template already sets cannot be repeated here — nginx
    # refuses a duplicate — and belongs in the configuration instead.
    include /etc/nginx/vhost.d/*.conf;
