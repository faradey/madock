server {
    listen      {{{.nginx.port.internal}}};
    server_name {{{range $i, $host := .nginx.hosts}}}{{{if $i}}} {{{end}}}{{{$host.name}}}{{{end}}};

    autoindex off;
    charset UTF-8;

    client_max_body_size       2G;

    # Docker's embedded DNS server. Resolving upstreams through a
    # variable defers DNS lookup to request time — nginx no longer
    # fails to start when the storefront container hasn't booted
    # yet, and DNS is re-checked after the resolver TTL so restarts
    # propagate too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    set $backend_upstream    "http://nodejs:9000";
    set $storefront_upstream "http://storefront:8000";

    # Shared proxy params for every backend/storefront location.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $forwarded_host;
    proxy_set_header X-Forwarded-Host $forwarded_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;

    # Dotfiles and dot-directories, /.well-known/ exempt. Replaces
    # `location ~* (\.htaccess$|\.git)`, which was unanchored and answered 403
    # to any URI merely containing ".git". Note the routes below are `^~`
    # prefixes, and nginx skips regex checks once one of those wins — so this
    # covers the storefront path, not /admin/… or /store/….
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Medusa backend routes — Admin UI (Vite) at /app, REST APIs at
    # /store, /admin, /auth, plus /health for readiness checks.
    location ^~ /health { proxy_pass $backend_upstream; }
    location ^~ /app    { proxy_pass $backend_upstream; }
    location ^~ /store  { proxy_pass $backend_upstream; }
    location ^~ /admin  { proxy_pass $backend_upstream; }
    location ^~ /auth   { proxy_pass $backend_upstream; }

    # Everything else — Next.js storefront on :8000.
    location / {
        proxy_pass $storefront_upstream;
    }

    gzip on;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/js
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;
    gzip_vary on;
}
