{{{- if .nodejs.enabled}}}
  nodejs:
    init: true
    build:
      context: ctx
      dockerfile: nodejs.Dockerfile
    tty: true
    environment:
      # Was hardcoded to "development", which is wrong the moment a project
      # runs on a server: libraries branch on it, and the entrypoint reads it
      # when no nodejs/script is configured.
      NODE_ENV: "{{{.nodejs.env}}}"
      # Polling-based file watching for macOS bind mounts (no inotify forwarding).
      # Harmless on Linux. Picked up by next/webpack/chokidar/medusa watcher.
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      {{{- if .nodejs.debug.enabled}}}
      # The port and the intent, not NODE_OPTIONS. Setting NODE_OPTIONS on the
      # container was the first attempt and it debugs the wrong process: the
      # entrypoint runs `yarn dev` / `npm run dev`, and yarn, npm and pnpm are
      # themselves Node programs — they inherit the variable, open the inspector
      # first and keep it, so the dev server they spawn fails to bind the port
      # and runs with no debugger at all while the IDE attaches to the package
      # manager. The entrypoint is the only place that knows what it is about to
      # start, so the decision belongs there.
      MADOCK_DEBUG_PORT: "9229"
      {{{- if .nodejs.debug.break}}}
      MADOCK_DEBUG_BREAK: "true"
      {{{- end}}}
      {{{- end}}}
    {{{- if .nodejs.debug.enabled}}}
    # The port inside the container is fixed and the one on the host is not:
    # inside there is one node process and nothing to collide with, while two
    # projects debugging at the same time would fight over a fixed host port.
    # The registry is what keeps them apart, and it is also what puts the
    # number into `madock info:ports` without that command knowing anything
    # about debugging.
    ports:
      - "{{{port "nodejs_debug"}}}:9229"
    {{{- end}}}
    volumes:
      - ./src:/var/www/html:cached
    extra_hosts:
      - "host.docker.internal:host-gateway"
      {{{- range $host := .nginx.hosts}}}
      - "{{{$host.name}}}:host-gateway"
      {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}
    {{{- if and .nodejs.enabled .isolation.enabled}}}
    networks:
      - isolated
    {{{- end}}}