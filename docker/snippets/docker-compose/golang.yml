{{{- if .golang.enabled}}}
  golang:
    init: true
    build:
      context: ctx
      dockerfile: golang.Dockerfile
    tty: true
    volumes:
      - ./src:/var/www/html:cached
      - ./ssh:/var/www/.ssh:ro
      - ./ssh/known_hosts:/var/www/.ssh/known_hosts:cached
    extra_hosts:
      - "host.docker.internal:host-gateway"
      {{{- range .nginx.hosts}}}
      - "{{{.name}}}:host-gateway"
      {{{- end}}}
    {{{- if .isolation.enabled}}}
    networks:
      - isolated
    {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}