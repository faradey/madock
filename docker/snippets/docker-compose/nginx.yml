{{{/* nginx is the one service here that is never optional, so this snippet
has no conditional of its own — and so no trim marker to begin its output
with a newline. This comment renders to nothing; the blank line below it is
the newline, and the one after that is the gap between two services. The
include that pulls this in trims the line it sat on, as it must for the
thirty optional services beside it. */}}}

  nginx:
    init: true
    build:
      context: ctx
      dockerfile: nginx.Dockerfile
    ports:
      - "{{{port "nginx"}}}:80"
      - "{{{port "nginx_ssl"}}}:443"
    volumes:
      - ./src:/var/www/html:delegated
      - ./ctx/nginx.conf:/etc/nginx/conf.d/default.conf:delegated
    extra_hosts:
      - "host.docker.internal:host-gateway"
      {{{- range .nginx.hosts}}}
      - "{{{.name}}}:host-gateway"
      {{{- end}}}
    {{{- if .main_service_enabled}}}
    depends_on:
      - {{{.main_service}}}
    {{{- end}}}
    {{{- if .isolation.enabled}}}
    networks:
      - opened
      - isolated
    {{{- end}}}
    restart: {{{.restart_policy}}}