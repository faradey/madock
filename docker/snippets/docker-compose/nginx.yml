{{{- if .nginx.enabled}}}
  nginx:
    init: true
    build:
      context: ctx
      dockerfile: nginx.Dockerfile
    ports:
      - "{{{port "nginx"}}}:80"
      - "{{{port "nginx_ssl"}}}:443"
    volumes:
      - ./src:/var/www/html:delegated
      - ./ctx/nginx.conf:/etc/nginx/conf.d/default.conf:delegated
      {{{- if .logs.persist.enabled}}}
      # The logging fragment goes into conf.d, which nginx includes inside the
      # http block, so it covers every server block — including a vhost the
      # project ships itself and which replaces madock's template entirely.
      - ./ctx/madock-logs.conf:/etc/nginx/conf.d/00-madock-logs.conf:delegated
      # Logs a rebuild cannot take away. Docker keeps a container's stdout in
      # the container's own directory, so `rebuild` deletes it — measured on a
      # production machine mid-incident, where three deploys left no HTTP record
      # of the minute being investigated.
      - logsdata:/var/log/madock
      {{{- end}}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
      {{{- range $host := .nginx.hosts}}}
      - "{{{$host.name}}}:host-gateway"
      {{{- end}}}
    {{{- if .main_service_enabled}}}
    depends_on:
      - {{{.main_service}}}
      {{{- if and .php.enabled .php.xdebug.enabled}}}
      # The second PHP container is named in the vhost as an upstream, and nginx
      # resolves upstream hostnames **when it loads its configuration** — not on
      # the first request. So a container that is not in docker's DNS yet is not
      # a slow start, it is `[emerg] host not found in upstream
      # "php_without_xdebug:9000"` and an nginx that exits 1 and stays down.
      #
      # Reported from outside on 2026-09-10 (issue #150), with the compose
      # output showing exactly that order: nginx started at 0.2s,
      # php_without_xdebug at 0.8s. Starting nginx by hand afterwards worked,
      # which is what a race looks like from the outside.
      - php_without_xdebug
      {{{- end}}}
    {{{- end}}}
    {{{- if .isolation.enabled}}}
    networks:
      - opened
      - isolated
    {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}