{{{- if and .db.enabled (eq .db.type "postgresql")}}}
  db:
    init: true
    build:
      context: ctx
      dockerfile: db.Dockerfile
    # Sized from db/memory, because postgres otherwise takes its stock
    # shared_buffers of 128MB and the only way to raise it was a copy of the
    # config in the project. effective_cache_size buys no memory — it tells the
    # planner how much of the OS cache to expect.
    command: >
      postgres
      -c shared_buffers={{{memShare .db.memory 1 4 "MB"}}}
      -c effective_cache_size={{{memShare .db.memory 3 4 "MB"}}}
    ports:
      - "{{{port "db"}}}:5432"
    environment:
      POSTGRES_DB: "{{{.db.database}}}"
      POSTGRES_USER: "{{{.db.user}}}"
      POSTGRES_PASSWORD: "{{{.db.password}}}"
    volumes:
    {{{- if versionGte .db.version "18"}}}
      # 18 moved the data one level up: the image keeps a major-version
      # directory under /var/lib/postgresql so that pg_ctlcluster and pg_upgrade
      # can see both versions at once. Mounting the old path there makes the
      # image refuse to start — it finds data in what it now considers an unused
      # mount — so an 18 project could not come up at all.
      - dbdata:/var/lib/postgresql
    {{{- else}}}
      - dbdata:/var/lib/postgresql/data
    {{{- end}}}
    {{{- if .isolation.enabled}}}
    networks:
      - isolated
    {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}