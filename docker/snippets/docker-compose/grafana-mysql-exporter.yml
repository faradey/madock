{{{- if .grafana.enabled}}}
  dbexporter:
    init: true
    image: prom/mysqld-exporter
    volumes:
      - ./ctx/grafana/mysql-exporter.my.cnf:/.my.cnf
    networks:
      - default
      {{{- if .isolation.enabled}}}
      - isolated
      {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}