{{{- if and .db.enabled (eq .db.type "mysql")}}}
  db:
    init: true
    {{{- if (not (and (eq (lower .db.repository) "mysql") (versionGte .db.version "8.4")))}}}
    command:
      --default-authentication-plugin=mysql_native_password
    {{{- end}}}
    build:
      context: ctx
      dockerfile: db.Dockerfile
    ports:
      - "{{{port "db"}}}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "{{{.db.root_password}}}"
      MYSQL_DATABASE: "{{{.db.database}}}"
      MYSQL_USER: "{{{.db.user}}}"
      MYSQL_PASSWORD: "{{{.db.password}}}"
    volumes:
      - dbdata:/var/lib/mysql
      - ./ctx/my.cnf:/etc/mysql/conf.d/mysql.cnf:delegated
      {{{- if .logs.persist.enabled}}}
      # Logs a rebuild cannot take away. Docker keeps a container's stdout in
      # the container's own directory, so `rebuild` deletes it — measured on a
      # production machine mid-incident, where three deploys left no HTTP record
      # of the minute being investigated.
      - logsdata:/var/log/madock
      {{{- end}}}
    {{{- if .isolation.enabled}}}
    networks:
      - isolated
    {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}