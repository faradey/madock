{{{- if and .db.enabled (eq .db.type "mysql")}}}
  db:
    init: true
    # InnoDB ignores SIGTERM until crash recovery is over, and a database that
    # was killed, or cloned from a running one, starts with recovery. Measured
    # on MariaDB 10.6 with the default 96 MB redo log: up to 9 s to become ready
    # after a kill under write load. Docker's 10 s default then kills it again
    # mid-recovery, and the next start recovers once more.
    stop_grace_period: 30s
    {{{- if (not (and (eq (lower .db.repository) "mysql") (versionGte .db.version "8.4")))}}}
    command:
      --default-authentication-plugin=mysql_native_password
    {{{- end}}}
    build:
      context: ctx
      dockerfile: db.Dockerfile
    {{{- if .ports.publish}}}
    ports:
      - "{{{port "db"}}}:3306"
    {{{- end}}}
    environment:
      MYSQL_ROOT_PASSWORD: "{{{.db.root_password}}}"
      MYSQL_DATABASE: "{{{.db.database}}}"
      MYSQL_USER: "{{{.db.user}}}"
      MYSQL_PASSWORD: "{{{.db.password}}}"
    volumes:
      - dbdata:/var/lib/mysql
      - ./ctx/my.cnf:/etc/mysql/conf.d/mysql.cnf:delegated
    {{{- if .isolation.enabled}}}
    networks:
      - isolated
    {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}