{{{- if .saleor.dashboard.enabled}}}
  dashboard:
    image: {{{.saleor.dashboard.repository}}}:{{{.saleor.dashboard.version}}}
    init: true
    ports:
      - "{{{port "saleor_dashboard"}}}:80"
    environment:
      API_URL: "{{{.saleor.dashboard.api_url}}}"
      APP_MOUNT_URI: "/"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      {{{- range $host := .nginx.hosts}}}
      - "{{{$host.name}}}:host-gateway"
      {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}
    {{{- if and .saleor.dashboard.enabled .isolation.enabled}}}
    networks:
      - isolated
    {{{- end}}}