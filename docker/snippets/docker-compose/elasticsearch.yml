{{{- if .search.elasticsearch.enabled}}}
  elasticsearch:
    init: true
    build:
      context: ctx
      dockerfile: elasticsearch.Dockerfile
    deploy:
      resources:
        limits:
          memory: {{{.search.elasticsearch.memory_limit}}}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms{{{.search.elasticsearch.heap}}} -Xmx{{{.search.elasticsearch.heap}}}"
      - "cluster.routing.allocation.disk.threshold_enabled=false"
      - "index.blocks.read_only_allow_delete"
    volumes:
      - elasticsearch_vlm_{{{.search.elasticsearch.version}}}:/usr/share/elasticsearch/data
    restart: {{{.restart_policy}}}
{{{- end}}}
    {{{- if and .search.elasticsearch.enabled .isolation.enabled}}}
    networks:
      - isolated
    {{{- end}}}