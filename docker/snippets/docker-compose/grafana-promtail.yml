{{{- if .grafana.enabled}}}
  promtail:
    init: true
    image: {{{.grafana.promtail.repository}}}:{{{.grafana.promtail.version}}}
    volumes:
      - ./ctx/grafana/promtail-config.yml:/etc/promtail/config.yml
      - ./src/var/log:/var/log
    command: --config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - default
      {{{- if .isolation.enabled}}}
      - isolated
      {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}