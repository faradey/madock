{{{- if .artemis.enabled}}}
  artemis:
    init: true
    image: {{{.artemis.repository}}}:{{{.artemis.version}}}
    environment:
      ARTEMIS_USER: {{{.artemis.user}}}
      ARTEMIS_PASSWORD: {{{.artemis.password}}}
    {{{- if .ports.publish}}}
    ports:
      - "{{{port "artemis"}}}:61616"
      - "{{{port "artemis_console"}}}:8161"
    {{{- end}}}
    networks:
      - default
      {{{- if .isolation.enabled}}}
      - isolated
      {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}