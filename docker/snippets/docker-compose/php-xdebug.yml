{{{- if and .php.enabled .php.xdebug.enabled}}}
  php_without_xdebug:
    init: true
    build:
      context: ctx
      dockerfile: php.DockerfileWithoutXdebug
    volumes:
      - ./src:/var/www/html:delegated
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - php
    restart: {{{.restart_policy}}}
{{{- end}}}
    {{{- if and .php.xdebug.enabled .isolation.enabled}}}
    networks:
      - isolated
    {{{- end}}}