{{{- if and .db.enabled .db.phpmyadmin.enabled}}}
  phpmyadmin:
    init: true
    image: {{{.db.phpmyadmin.repository}}}:{{{.db.phpmyadmin.version}}}
    ports:
      - "{{{port "phpmyadmin"}}}:80"
    environment:
      PMA_HOST: "db"
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
      PMA_ABSOLUTE_URI: "http://{{{(index .nginx.hosts 0).name}}}/phpmyadmin/"
      PMA_USER: root
      PMA_PASSWORD: {{{.db.root_password}}}
      UPLOAD_LIMIT: 2G
    depends_on:
      - db
    networks:
      - default
      {{{- if .isolation.enabled}}}
      - isolated
      {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}