{{{- if .search.opensearch.dashboard.enabled}}}
  opensearchdashboard:
    init: true
    {{{- if versionLt .search.opensearch.version "1.1"}}}
    # OpenSearch Dashboards 1.0 is published for amd64 only, so an arm64 host has
    # to be told to emulate it. From 1.1 on there is an arm64 image and docker
    # takes the host's own architecture.
    platform: linux/amd64
    {{{- end}}}
    image: {{{.search.opensearch.dashboard.repository}}}:{{{.search.opensearch.version}}}
    ports:
      - "{{{port "opensearchdashboard"}}}:5601"
    environment:
      SERVER_BASEPATH: /opensearch-dashboard
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: 'true'
    depends_on:
      - opensearch
    networks:
      - default
      {{{- if .isolation.enabled}}}
      - isolated
      {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}