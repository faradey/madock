{{{- if .varnish.enabled}}}
  varnish:
    init: true
    image: {{{.varnish.repository}}}:{{{.varnish.version}}}
    {{{- if .ports.publish}}}
    ports:
      - "{{{port "varnish"}}}:6081"
    {{{- end}}}
    volumes:
      - ./src/{{{.varnish.config_file}}}:/etc/varnish/default.vcl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
      {{{- range $host := .nginx.hosts}}}
      - "{{{$host.name}}}:host-gateway"
      {{{- end}}}
    command: "-p default_keep=300"
    environment:
      VARNISH_HTTP_PORT: 6081
      VARNISH_SIZE: {{{.varnish.size}}}
    {{{- if .nginx.enabled}}}
    depends_on:
      - nginx
    {{{- end}}}
    networks:
      - default
      {{{- if .isolation.enabled}}}
      - isolated
      {{{- end}}}
      {{{- if not .ports.publish}}}
      # Varnish is what the shared proxy talks to when it is enabled; with no
      # port on the host it is reached on this network, by the container's name.
      - madock-proxy
      {{{- end}}}
    restart: {{{.restart_policy}}}
{{{- end}}}