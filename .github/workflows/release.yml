name: Release

on:
  push:
    tags:
      - 'v*'
      # Opt-out: a tag ending in -norelease (e.g. v3.8.7-norelease) is pushed
      # without triggering a release build. The negative pattern must stay after
      # the positive one — GitHub applies tag filters in order.
      - '!v*-norelease'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build binaries
        run: |
          mkdir -p dist
          targets="darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64"
          for t in $targets; do
            os="${t%/*}"
            arch="${t#*/}"
            out="madock-${os}-${arch}"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            echo "Building $out$ext"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags="-s -w" -o "dist/${out}${ext}"
          done

      # Answers "did I download what they published" for every platform at once,
      # including the ones that will never be signed. It is not a signature: it
      # proves the file matches this page, not who built it. Cheap enough that
      # the absence was never a decision, only an omission.
      #
      # Written from inside dist/ so the file lists bare names — `shasum -c
      # SHA256SUMS` then works wherever the user unpacked them — and generated
      # before the checksum file exists, so it never tries to hash itself.
      - name: Checksums
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Generate changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="${GITHUB_REF_NAME}"
          # Base the changelog on the previous PUBLISHED release (not every tag gets one).
          prev=$(gh release list --limit 100 --exclude-drafts --json tagName \
                   --jq "[.[] | .tagName] | map(select(. != \"$current\")) | .[0] // \"\"" 2>/dev/null || echo "")
          # Fallbacks: previous tag, then full history.
          if [ -z "$prev" ]; then
            prev=$(git describe --tags --abbrev=0 "${current}^" 2>/dev/null || echo "")
          fi
          sh .github/scripts/release-notes.sh "$current" "$prev" > RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: dist/*
