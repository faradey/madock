# Continuous integration.
#
# Two jobs, because they answer different questions and cost different amounts.
# `test` is seconds and gates everything; `e2e` starts real containers and takes
# a quarter of an hour.
#
# The end-to-end suite needs a Docker daemon nobody else is using — madock's
# proxy is a compose stack named `aruntime` written into the templates rather
# than derived, so a test that starts a project operates on the same containers
# as anything else on the machine. On a developer's laptop that means a VM (see
# test/e2e/lima.yaml). A hosted runner already is one: a disposable Linux box
# with Docker and nothing else on it, so the suite runs directly and the VM would
# only be a second layer of virtualisation to pay for.

name: CI

# `staging` is where work is verified and `master` is where verified work lands.
# The end-to-end suite only ever runs here — the build tag keeps it out of the
# pre-push hook, and the Lima VM on a laptop is the iteration loop, not the
# verdict — so a branch that CI does not watch is a branch whose e2e nobody has
# run. master then receives a fast-forward of exactly the tree that was green.
#
# It costs a second run of the same tree on master. That is deliberate: the run
# on master is the record of what master did, and re-running is cheaper than
# reasoning about whether a green run on another ref still applies.
#
# The nightly schedule is for the platform job below, which installs Magento,
# Shopware and Medusa from their vendors. What that job catches is mostly not
# ours: an image tag withdrawn, a starter repository moved, a package that no
# longer resolves. None of it arrives with a commit, so waiting for a push to
# find out means finding out from a customer instead.
on:
  push:
    branches: [master, staging]
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

# Nothing here publishes anything. Said explicitly rather than left to the
# default, which differs between repository settings.
permissions:
  contents: read

# A pull request that gets three pushes in a minute should run the third one,
# not all three. Every commit on the default branch gets its own run, because
# those runs are the record of what master did.
#
# The exemption has to be in the group and not only in cancel-in-progress.
# GitHub keeps one run in progress and one waiting per group: a third arrival
# replaces the one that was waiting, and the replaced run is cancelled before it
# starts a single job. Three pushes in quick succession therefore left the middle
# commit with no run at all — observed twice on master before this was written
# down. Putting the commit in the group means pushes never share one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so the version is decided in one place and CI cannot
          # drift away from what developers build with.
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # -count=1 is not decoration. Go caches a package's result until one of its
      # .go files changes, and the golden tests read their input from docker/ —
      # data the cache knows nothing about. Without it, a broken template gets a
      # cached `ok`. Measured, not assumed.
      - name: Test
        run: go test -count=1 ./...

      # The end-to-end suite is behind a build tag, so nothing above compiles it.
      # This does, without needing Docker: a test file that stops building should
      # not be discovered by the job that takes fifteen minutes.
      - name: Check the end-to-end tests still compile
        run: go vet -tags=e2e ./test/...

  e2e:
    name: End-to-end
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # run-local refuses to touch a daemon that might be somebody's own; CI=true
      # is what tells it this one is disposable. GitHub sets it.
      - name: Run the end-to-end suite
        run: ./test/e2e/e2e.sh run-local

  # The platform tests install a real store — Shopware and Medusa here, from
  # public packages. They are the only tests that can see a broken image, a
  # withdrawn tag or a package that no longer resolves, and until this job
  # existed they ran on one laptop and nowhere else: opt-in locally means
  # nobody's CI has ever proven them.
  #
  # A separate job rather than a flag on the one above, because they answer a
  # different question and take twice as long: the suite proves madock, this
  # proves madock against the world as it is today. Splitting them also means a
  # vendor outage does not read as "the end-to-end suite is red".
  #
  # Magento skips here and says so. Its download needs Adobe credentials, and
  # those do not belong in a public repository's secrets — which is why it stays
  # a local test and this job carries the two that can be public.
  platforms:
    name: Platforms
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Shopware and Medusa for real
        run: ./test/e2e/e2e.sh run-local --platforms -run 'TestMagentoInstallsAndAnswers|TestShopwareInstallsAndAnswers|TestMedusaInstallsAndAnswers'
